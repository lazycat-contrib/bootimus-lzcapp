version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: bootimus

build:
  run_buildscript: false

images:
  - id: bootimus
    target: service
    service: bootimus
    source: garybowers/bootimus
    channel: stable
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    continue_if_newer_version: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Bootimus
    summary: Published from CI